services:
  web:
    build: .
    container_name: verifdoc_web
    restart: unless-stopped
    ports:
      - "8085:80"
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=plateforme_verification
      - DB_USER=root
      - DB_PASS=rootpassword
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: verifdoc_db
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_DATABASE=plateforme_verification
    volumes:
      - db_data:/var/lib/mysql
      - ./database.sql:/docker-entrypoint-initdb.d/01_init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  db_data:
